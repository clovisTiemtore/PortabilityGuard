name: Code quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install ".[dev]"
      - name: Run pre-commit checks
        run: pre-commit run --all-files
