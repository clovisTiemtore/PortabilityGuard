repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: local
    hooks:
      - id: black
        name: Black
        entry: python -m black --check
        language: system
        types: [python]
      - id: ruff
        name: Ruff
        entry: python -m ruff check
        language: system
        types: [python]
